<div class="nav-container" [ngClass]="{'scrolled': isScrolled, 'menu-open': isMenuOpen}">
  <div class="nav-left">
    <a [routerLink]="getRouterLink('')" class="logo-link">
      <img width="200" src="https://applisound-images.s3.eu-west-3.amazonaws.com/applisound-bleu.png" 
           alt="Applisound logo" 
           [ngClass]="{'mobile-logo': isMobile}">
    </a>
    
    <button class="burger-menu" (click)="toggleMenu()" *ngIf="isMobile" aria-label="Toggle menu">
      <span [class.active]="isMenuOpen"></span>
      <span [class.active]="isMenuOpen"></span>
      <span [class.active]="isMenuOpen"></span>
    </button>
  </div>

  <nav class="nav-links" [class.mobile-menu]="isMobile" [class.show]="isMenuOpen">
    <div class="nav-indicator" [style.transform]="'translateX(' + indicatorPosition + 'px)'" [style.width]="indicatorWidth + 'px'" [style.opacity]="hasActiveLink ? 1 : 0"></div>
    
    <a [routerLink]="getRouterLink('music')" routerLinkActive="active" (click)="closeMenuIfMobile()" #navLink>
      {{ 'NAV.MUSIC' | translate }}
    </a>
    <a [routerLink]="getRouterLink('voiceover')" routerLinkActive="active" (click)="closeMenuIfMobile()" #navLink>
      {{ 'NAV.VOICEOVER' | translate }}
    </a>
    <a [routerLink]="getRouterLink('producsounds')" routerLinkActive="active" (click)="closeMenuIfMobile()" #navLink>
      {{ 'NAV.PRODUCSOUNDS' | translate }}
    </a>
    <a [routerLink]="getRouterLink('pricing')" routerLinkActive="active" (click)="closeMenuIfMobile()" #navLink>
      {{ 'NAV.PRICING' | translate }}
    </a>
    <a [routerLink]="getRouterLink('enterprise')" routerLinkActive="active" (click)="closeMenuIfMobile()" #navLink>
      {{ 'NAV.ENTERPRISE' | translate }}
    </a>
    <a [routerLink]="getRouterLink('how-it-works')" routerLinkActive="active" (click)="closeMenuIfMobile()" #navLink>
      {{ 'NAV.HOW_IT_WORKS' | translate }}
    </a>
    
    <div class="mobile-auth" *ngIf="isMobile">
      <button class="btn-login" [routerLink]="getRouterLink('login')" (click)="closeMenuIfMobile()">
        {{ 'NAV.LOGIN' | translate }}
      </button>
      <button class="btn-create-account" [routerLink]="getRouterLink('signup')" (click)="closeMenuIfMobile()">
        {{ 'NAV.CREATE_ACCOUNT' | translate }}
      </button>
    </div>
  </nav>

  <div class="nav-right" *ngIf="!isMobile">
    <button class="btn-login" [routerLink]="getRouterLink('login')">{{ 'NAV.LOGIN' | translate }}</button>
    <button class="btn-create-account" [routerLink]="getRouterLink('signup')">{{ 'NAV.CREATE_ACCOUNT' | translate }}</button>
  </div>
</div>
