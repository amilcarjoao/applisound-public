

<div class="player-container">

  <h2>{{ sectionTitle }}</h2>
  
  <div class="tracks-container">
    <div class="tracks-list" #tracksList>
      <div *ngFor="let track of tracks" 
           class="track-item"
           [class.active]="currentTrack?.id === track.id"
           (click)="playTrack(track)">
        <div class="track-info">
          <span class="track-title">{{ track.title }}</span>
          <span class="track-artist">{{ track.artist }}</span>
        </div>
        <span class="track-duration">{{ track.duration }}</span>
      </div>
    </div>
  </div>

  <div class="player-controls">
    <div class="progress-container">
      <div class="progress-bar" 
           (mousedown)="startSeek($event)"
           (mousemove)="seeking($event)"
           (mouseup)="endSeek()"
           (mouseleave)="endSeek()">
        <div class="progress" [style.width]="progress + '%'"></div>
      </div>
      <div class="time-info">
        <span>{{ currentTime | time }}</span>
        <span>{{ duration | time }}</span>
      </div>
    </div>

    <div class="controls">
      <button class="control-btn" (click)="previousTrack()">
        <img src="https://applisound-images.s3.eu-west-3.amazonaws.com/mini-icones/prevw.png" alt="Previous">
      </button>
      <button class="control-btn play-btn" (click)="togglePlay()">
        <img [src]="isPlaying ? 'https://applisound-images.s3.eu-west-3.amazonaws.com/mini-icones/pausew.png' : 'https://applisound-images.s3.eu-west-3.amazonaws.com/mini-icones/playw.png'" 
             [alt]="isPlaying ? 'Pause' : 'Play'">
      </button>
      <button class="control-btn" (click)="nextTrack()">
        <img src="https://applisound-images.s3.eu-west-3.amazonaws.com/mini-icones/nextw.png" alt="Next">
      </button>

      <button class="control-btn" (click)="toggleRepeat()">
          <img [src]="repeat === 'one' ? 'https://applisound-images.s3.eu-west-3.amazonaws.com/mini-icones/repeat1w.png' : 
                      repeat === 'all' ? 'https://applisound-images.s3.eu-west-3.amazonaws.com/mini-icones/repeatallw.png' : 
                      'https://applisound-images.s3.eu-west-3.amazonaws.com/mini-icones/repeatw.png'"
               [alt]="repeat === 'one' ? 'Repeat One' : 
                      repeat === 'all' ? 'Repeat All' : 
                      'Repeat Off'">
        </button>
        

    </div>

    <button class="create-button" (click)="openTypeForm()">
      <span>{{ createButtonText }}</span>
      <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M5 12H19M19 12L12 5M19 12L12 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    

  </div>
</div>
