<!-- modal/project-form-modal.component.html -->
<div class="modal-overlay" [@overlayAnimation] (click)="closeModal()">
  <div class="modal-container" [@modalAnimation] (click)="$event.stopPropagation()">
    <button class="close-button" (click)="closeModal()">
      <img src="assets/icons/close.svg" alt="Close">
    </button>

    <div class="modal-content">
      <!-- En-tête -->
      <div class="modal-header">
        <img src="assets/logo.png" alt="Applisound Logo" class="logo">
        <h2>{{ getStepTitle() }}</h2>
      </div>

      <!-- Contenu dynamique -->
      <div class="modal-body" [ngSwitch]="currentStep">
        <app-form-step-one *ngSwitchCase="1"></app-form-step-one>
        <app-form-step-two *ngSwitchCase="2"></app-form-step-two>
        <app-form-step-three *ngSwitchCase="3"></app-form-step-three>
      </div>

      <!-- Navigation -->
      <div class="modal-footer">
        <button 
          *ngIf="currentStep > 1" 
          class="btn-previous" 
          (click)="previousStep()">
          Précédent
        </button>
        <button 
          *ngIf="currentStep < totalSteps" 
          class="btn-next" 
          (click)="nextStep()">
          Suivant
        </button>
        <button 
          *ngIf="currentStep === totalSteps" 
          class="btn-validate" 
          (click)="validateForm()">
          Valider
        </button>
      </div>
    </div>
  </div>
</div>
