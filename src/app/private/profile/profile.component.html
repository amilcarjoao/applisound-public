<!-- src/app/private/profile/profile.component.html -->
<div class="profile-container">
  <h1>Mon Profil</h1>
  <p class="subtitle">Gérez vos informations personnelles</p>

  <div class="profile-card">
    <div class="profile-header">
      <div class="profile-avatar">
        <img [src]="user.avatar" alt="Avatar" />
      </div>
      <div class="profile-title">
        <h2>{{ user.firstName }} {{ user.lastName }}</h2>
        <p>{{ user.email }}</p>
      </div>
      <button class="edit-button" (click)="toggleEdit()">
        <i class="fas" [ngClass]="isEditing ? 'fa-times' : 'fa-edit'"></i>
        {{ isEditing ? "Annuler" : "Modifier" }}
      </button>
    </div>

    <div class="profile-content">
      <div class="profile-form" *ngIf="isEditing">
        <div class="form-group">
          <label for="firstName">Prénom</label>
          <input
            type="text"
            id="firstName"
            [(ngModel)]="user.firstName"
            class="form-control"
          />
        </div>

        <div class="form-group">
          <label for="lastName">Nom</label>
          <input
            type="text"
            id="lastName"
            [(ngModel)]="user.lastName"
            class="form-control"
          />
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            [(ngModel)]="user.email"
            class="form-control"
          />
        </div>

        <div class="form-group">
          <label for="phone">Téléphone</label>
          <input
            type="tel"
            id="phone"
            [(ngModel)]="user.phone"
            class="form-control"
          />
        </div>

        <div class="form-group">
          <label for="company">Entreprise</label>
          <input
            type="text"
            id="company"
            [(ngModel)]="user.company"
            class="form-control"
          />
        </div>

        <div class="form-actions">
          <button class="save-button" (click)="saveProfile()">
            <i class="fas fa-save"></i> Enregistrer
          </button>
        </div>
      </div>

      <div class="profile-info" *ngIf="!isEditing">
        <div class="info-group">
          <h3>Informations personnelles</h3>
          <div class="info-row">
            <div class="info-label">Prénom</div>
            <div class="info-value">{{ user.firstName }}</div>
          </div>
          <div class="info-row">
            <div class="info-label">Nom</div>
            <div class="info-value">{{ user.lastName }}</div>
          </div>
          <div class="info-row">
            <div class="info-label">Email</div>
            <div class="info-value">{{ user.email }}</div>
          </div>
          <div class="info-row">
            <div class="info-label">Téléphone</div>
            <div class="info-value">{{ user.phone }}</div>
          </div>
          <div class="info-row">
            <div class="info-label">Entreprise</div>
            <div class="info-value">{{ user.company }}</div>
          </div>
        </div>

        <div class="info-group">
          <h3>Sécurité</h3>
          <button class="password-button">
            <i class="fas fa-lock"></i> Changer le mot de passe
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
