<!-- NAV BAR PERMANENT --> 
<app-nav-bar *ngIf="!isDashboardRoute"></app-nav-bar>

<div class="app-wrapper">
    <main class="main-content">
        <!-- TOUTES LES ROUTES SE LANCENT ICI AU MILIEU DU NAV ET FOOTER --> 
        <div [@routeAnimations]="prepareRoute(outlet)" class="route-container">
            <router-outlet #outlet="outlet"></router-outlet>
        </div>
    </main>

    <!-- FOOTER PERMANENT --> 
    <app-footer *ngIf="!isDashboardRoute"></app-footer>
</div>
